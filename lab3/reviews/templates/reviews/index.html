<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>{{ title }}</title>
</head>
<body>
    <h1>{{ title }}</h1>
    {% for item in reviews %}
        <div>
            <h3>{{ item.product_name }}</h3>
            <p>Автор: {{ item.author }}</p>
            <p>Оценка: {{ item.rating }} / 5</p>
            <p>{{ item.text }}</p>
            <!-- Фильтр date для красивого вывода даты -->
            <p><small>Дата: {{ item.created_at|date:"Y-m-d H:i:s" }}</small></p>
        </div>
        <hr>
    {% endfor %}
</body>
</html>
